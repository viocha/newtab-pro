  <!-- Card bottom-right -->
  <rect x="268" y="268" width="188" height="188" rx="24" fill="white" fill-opacity="0.93"/>
  <rect x="268" y="268" width="188" height="40" rx="24" fill="url(#g4)"/>
  <rect x="268" y="292" width="188" height="16" fill="url(#g4)"/>
