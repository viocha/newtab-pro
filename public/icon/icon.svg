  <rect x="268" y="56" width="188" height="188" rx="24" fill="white" fill-opacity="0.93"/>
  <rect x="268" y="56" width="188" height="40" rx="24" fill="url(#g2)"/>
  <rect x="268" y="80" width="188" height="16" fill="url(#g2)"/>
  <rect x="292" y="116" width="88" height="10" rx="5" fill="#CBD5E1"/>
